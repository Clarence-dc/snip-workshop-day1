name: Build bundle

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: snip-bundle
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main and its submodules
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          submodules: true
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Configure bot identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Rebuild and publish bundle
        run: node scripts/build-bundle.mjs --push

# No push trigger: this workflow exists only on main, so pushes to component
# branches cannot trigger it. The schedule is disabled; only the manual trigger remains.
